# 사용법
#   docker compose build                               # 최초 1회, requirements/Dockerfile 변경 시 다시
#   docker compose run --rm secant <명령>               # 예: python -m src.train
#   docker compose up jupyter                          # http://localhost:8888
x-common: &common
  build:
    context: .
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: secant:latest
  volumes:
    - ./:/workspace          # 코드는 마운트 → 코드 수정 시 재빌드 불필요
  working_dir: /workspace

services:
  secant:
    <<: *common
    stdin_open: true
    tty: true

  jupyter:
    <<: *common
    ports:
      - "127.0.0.1:8888:8888"   # 내 컴퓨터에서만 접속 가능 (외부 노출 X)
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --ServerApp.root_dir=/workspace
      --IdentityProvider.token=''
